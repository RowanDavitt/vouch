name: Check PR
description: "Check if a PR author is a vouched contributor, optionally closing unvouched PRs."

inputs:
  pr-number:
    description: "Forgejo PR number."
    required: true
  auto-close:
    description: "Automatically close PRs from unvouched or denounced users."
    required: false
    default: "false"
  dry-run:
    description: "Print what would happen without making changes."
    required: false
    default: "false"
  repo:
    description: "Repository in 'owner/repo' format (default: current repository)."
    required: false
    default: ""
  platform_url:
    description: "Url for the platform (ex: codeberg.com) (default: current url for current platform)."
    required: false
    default: ""
  api_url:
    description: "Url to send api requests (ex: https://codeberg.com/api/v1)  (default: current api for current platform)."
    required: false
    default: ""
  require-vouch:
    description: "Require users to be vouched (false = only block denounced)."
    required: false
    default: "true"
  vouched-file:
    description: "Path to the vouched contributors file in the repo."
    required: false
    default: ".forgejo/VOUCHED.td"
  vouched-repo:
    description: "Repository for the vouched file in 'owner/repo' format (default: same as repo)."
    required: false
    default: ""
  template-file:
    description: "An optional path to a response template to use for unvouched users."
    required: false
    default: ""

outputs:
  status:
    description: "Result status: skipped, vouched, allowed, or closed"
    value: ${{ steps.run.outputs.status }}

runs:
  using: composite
  steps:
    - uses: codeberg.org/NiceGuyIT/action-install-nushell@8ae3885bd39c1b0f31ac32fd9a415d5c2799b9cf

    - id: run
      shell: nu {0}
      run: |
        use "${{ forgejo.action_path }}/../../vouch" *

        let status = (fj-check-pr
          ${{ inputs.pr-number }}
          -R "${{ inputs.repo || forgejo.repository }}"
          -A "${{ inputs.api_url || forgejo.api_url }}"
          -P "${{inputs.platform_url ||  forgejo.server_url}}"
          --vouched-repo "${{ inputs.vouched-repo }}"
          --vouched-file "${{ inputs.vouched-file }}"
          --template-file "${{ inputs.template-file }}"
          --require-vouch=${{ inputs.require-vouch }}
          --auto-close=${{ inputs.auto-close }}
          --dry-run=${{ inputs.dry-run }}
        )
        $"status=($status)" | save --append $env.GITHUB_OUTPUT
